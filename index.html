<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Your Sound</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #08080c;
  --bg-elevated: #111118;
  --bg-card: #16161f;
  --bg-card-hover: #1c1c28;
  --bg-card-selected: #1a1530;
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.12);
  --border-selected: rgba(139,92,246,0.35);
  --accent: #8b5cf6;
  --accent-dim: rgba(139,92,246,0.15);
  --accent-glow: rgba(139,92,246,0.25);
  --text: #e8e8ef;
  --text-secondary: #8888a0;
  --text-muted: #555568;
  --radius: 12px;
  --radius-lg: 16px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 900px;
  margin: 0 auto;
  padding: 3rem 1.5rem 4rem;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 2.5rem;
  padding-bottom: 2rem;
  border-bottom: 1px solid var(--border);
}

.header h1 {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--text);
  margin-bottom: 0.4rem;
}

.header h1 span { color: var(--accent); }

.header p {
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 400;
}

/* Presets */
.presets-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  margin-bottom: 0.8rem;
  font-weight: 600;
}

.presets-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 2.5rem;
}

.preset-btn {
  padding: 0.45rem 1rem;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.preset-btn:hover {
  border-color: var(--accent);
  color: var(--text);
  background: var(--accent-dim);
}

/* Progress */
.progress {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin-bottom: 2rem;
  padding: 0 0.5rem;
}

.progress-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.25s ease;
  background: transparent;
}

.progress-dot.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}

.progress-dot.done {
  border-color: var(--accent);
  color: white;
  background: var(--accent);
}

.progress-line {
  width: 20px;
  height: 1.5px;
  background: var(--border);
  transition: background 0.25s ease;
}

.progress-line.done { background: var(--accent); }

/* Steps */
.step-section {
  display: none;
}

.step-section.active {
  display: block;
  animation: fadeUp 0.35s ease forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.step-header {
  margin-bottom: 1.5rem;
}

.step-tag {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 0.4rem;
}

.step-title {
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 0.3rem;
}

.step-desc {
  color: var(--text-secondary);
  font-size: 0.85rem;
}

/* Cards */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.75rem;
}

@media (max-width: 700px) {
  .cards-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 480px) {
  .cards-grid { grid-template-columns: 1fr; }
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
}

.card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-hover);
}

.card.selected {
  border-color: var(--border-selected);
  background: var(--bg-card-selected);
}

.card.selected::after {
  content: '';
  position: absolute;
  top: 10px;
  right: 10px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}

.card.selected::before {
  content: '✓';
  position: absolute;
  top: 10px;
  right: 11px;
  color: white;
  font-size: 0.6rem;
  font-weight: 700;
  z-index: 1;
}

.card-label {
  font-size: 0.88rem;
  font-weight: 600;
  margin-bottom: 0.3rem;
}

.card-desc {
  font-size: 0.75rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

/* Navigation */
.nav-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 2rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--border);
}

.btn {
  padding: 0.6rem 1.4rem;
  border-radius: 8px;
  border: none;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  font-size: 0.75rem;
  padding: 0.45rem 0.8rem;
}

.btn-ghost:hover { color: #ef4444; }

.btn-outline {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.btn-outline:hover {
  border-color: var(--border-hover);
  color: var(--text);
}

.btn-primary {
  background: var(--accent);
  color: white;
}

.btn-primary:hover {
  background: #7c3aed;
}

/* Negative section */
.negative-section {
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
}

.negative-section h3 {
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 0.2rem;
}

.negative-section > p {
  color: var(--text-secondary);
  font-size: 0.8rem;
  margin-bottom: 1rem;
}

.negative-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.negative-pill {
  padding: 0.4rem 0.9rem;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.76rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.negative-pill:hover {
  border-color: rgba(239,68,68,0.4);
  color: var(--text);
}

.negative-pill.selected {
  border-color: rgba(239,68,68,0.5);
  background: rgba(239,68,68,0.1);
  color: #fca5a5;
}

/* Output */
.output-section {
  margin-top: 2.5rem;
  display: none;
}

.output-section.visible {
  display: block;
  animation: fadeUp 0.4s ease forwards;
}

.output-box {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
}

.output-box label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  font-weight: 600;
  display: block;
  margin-bottom: 0.6rem;
}

.output-text {
  font-size: 0.9rem;
  line-height: 1.7;
  color: var(--text);
  min-height: 40px;
  margin-bottom: 1rem;
}

.brief-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.8rem;
  margin-bottom: 1rem;
}

.brief-block {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.8rem;
}

.brief-value {
  font-size: 0.83rem;
  color: var(--text-secondary);
  line-height: 1.55;
}

.output-meta-row {
  display: flex;
  gap: 2rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

.meta-block label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  font-weight: 600;
  display: block;
  margin-bottom: 0.3rem;
}

.meta-value {
  font-size: 0.82rem;
  color: var(--text-secondary);
}

.genre-pills {
  display: flex;
  gap: 0.3rem;
  flex-wrap: wrap;
}

.genre-pill {
  padding: 0.15rem 0.55rem;
  border-radius: 6px;
  background: var(--accent-dim);
  border: 1px solid var(--border-selected);
  font-size: 0.7rem;
  color: #c4b5fd;
  font-weight: 500;
}

.output-actions {
  display: flex;
  gap: 0.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

.copy-btn {
  padding: 0.4rem 0.9rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.75rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.copy-btn:hover {
  background: var(--bg-card-hover);
  color: var(--text);
}

.copy-btn.done {
  border-color: var(--accent);
  color: var(--accent);
}

.neg-output {
  margin-top: 0.8rem;
  padding-top: 0.8rem;
  border-top: 1px solid var(--border);
}

.neg-output label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  font-weight: 600;
  display: block;
  margin-bottom: 0.3rem;
}

.neg-text {
  font-size: 0.82rem;
  color: #fca5a5;
}

/* Toast */
.toast {
  position: fixed;
  top: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: var(--bg-elevated);
  border: 1px solid var(--accent);
  color: var(--text);
  padding: 0.6rem 1.2rem;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 500;
  z-index: 200;
  transition: transform 0.3s ease;
}

.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1>Build Your <span>Sound</span></h1>
    <p>Конфигуратор промптов для Suno v5</p>
  </header>

  <div class="presets-label">Пресеты</div>
  <div class="presets-row" id="presetsRow"></div>

  <nav class="progress" id="progress"></nav>

  <div id="stepsContainer"></div>

  <section class="negative-section" id="negativeSection">
    <h3>Исключить элементы</h3>
    <p>Отметьте то, что не должно присутствовать в треке</p>
    <div class="negative-pills" id="negativePills"></div>
  </section>

  <div class="nav-row">
    <button class="btn btn-ghost" id="resetBtn">Сбросить всё</button>
    <div style="display:flex; gap:0.6rem;">
      <button class="btn btn-outline" id="prevBtn" style="display:none;">← Назад</button>
      <button class="btn btn-primary" id="nextBtn">Далее →</button>
    </div>
  </div>

  <section class="output-section" id="outputSection">
    <div class="output-box">
      <label>Промпт для Suno v5</label>
      <div class="output-text" id="outputText"></div>
      <div class="brief-grid">
        <div class="brief-block">
          <label>Style tags</label>
          <div class="brief-value" id="styleTagsText">—</div>
        </div>
        <div class="brief-block">
          <label>Production notes</label>
          <div class="brief-value" id="prodNotesText">—</div>
        </div>
      </div>
      <div class="output-meta-row">
        <div class="meta-block">
          <label>BPM</label>
          <div class="meta-value" id="bpmMeta">—</div>
        </div>
        <div class="meta-block">
          <label>Структура</label>
          <div class="meta-value" id="structMeta">—</div>
        </div>
        <div class="meta-block">
          <label>Жанры</label>
          <div class="genre-pills" id="genrePills"></div>
        </div>
      </div>
      <div class="neg-output" id="negOutput" style="display:none;">
        <label>Negative prompt</label>
        <div class="neg-text" id="negText"></div>
      </div>
      <div class="output-actions">
        <button class="copy-btn" id="copyPromptBtn">Копировать промпт</button>
        <button class="copy-btn" id="copyNegBtn">Копировать negative</button>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

const state = {
  currentStep: 0,
  selections: { purpose:[], emotion:[], rhythm:[], palette:[], vocals:[], era:[], structure:[] },
  negativeTags: [],
  totalSteps: 7,
  prompt: "",
  negativePrompt: ""
};

const catOrder = ['purpose','emotion','rhythm','palette','vocals','era','structure'];

const COMPOSER = {
  bpmPriority: ['rhythm', 'purpose', 'emotion'],
  rhythmBuckets: {
    floating_ambient: [60, 80],
    steady_groove: [90, 115],
    syncopated: [90, 112],
    gradual_build: [118, 132],
    minimal_repetitive: [110, 126],
    beat_switches: [85, 118],
    broken_rhythm: [118, 145],
    explosive_drops: [130, 155],
    fast_paced: [150, 178]
  },
  genreRuleBoosts: [
    { when: ['analog_synths','retro_80s','dreamy','airy_female'], boost: { 'Synth-pop': 4, 'Dream Pop': 4 } },
    { when: ['distorted_guitars','aggressive','live_drums'], boost: { 'Alternative Rock': 4, 'Hard Rock': 4 } },
    { when: ['cinematic','cinematic_strings','choir'], boost: { 'Film Score': 4, 'Orchestral': 3 } },
    { when: ['indie_bedroom','whispery','intimate'], boost: { 'Bedroom Pop': 4, 'Indie Pop': 2 } }
  ],
  conflictRules: [
    { negative: 'no_vocals', selectedCats: ['vocals'], message: 'instrumental focus (no lead vocals)' },
    { negative: 'no_orchestral', selectedIds: ['cinematic_strings', 'choir'], message: 'minimal orchestral color' },
    { negative: 'no_aggressive_drums', selectedIds: ['explosive_drops', 'aggressive', 'live_drums'], message: 'controlled transient dynamics' }
  ]
};

const $ = id => document.getElementById(id);

function init() {
  renderPresets();
  renderProgress();
  renderSteps();
  renderNegative();
  bindEvents();
}

function renderPresets() {
  const row = $('presetsRow');
  row.innerHTML = '';
  for (const [key, p] of Object.entries(DATA.presets)) {
    const b = document.createElement('button');
    b.className = 'preset-btn';
    b.textContent = p.name;
    b.addEventListener('click', () => applyPreset(key));
    row.appendChild(b);
  }
}

function renderProgress() {
  const bar = $('progress');
  bar.innerHTML = '';
  for (let i = 0; i < state.totalSteps; i++) {
    const d = document.createElement('div');
    d.className = 'progress-dot';
    d.textContent = i + 1;
    d.addEventListener('click', () => goToStep(i));
    bar.appendChild(d);
    if (i < state.totalSteps - 1) {
      const l = document.createElement('div');
      l.className = 'progress-line';
      bar.appendChild(l);
    }
  }
  updateProgress();
}

function updateProgress() {
  const dots = $('progress').querySelectorAll('.progress-dot');
  const lines = $('progress').querySelectorAll('.progress-line');
  dots.forEach((d, i) => {
    d.classList.remove('active','done');
    if (i === state.currentStep) d.classList.add('active');
    else if (i < state.currentStep) d.classList.add('done');
  });
  lines.forEach((l, i) => l.classList.toggle('done', i < state.currentStep));
}

function renderSteps() {
  const container = $('stepsContainer');
  container.innerHTML = '';
  catOrder.forEach((key, idx) => {
    const cat = DATA.categories[key];
    const sec = document.createElement('div');
    sec.className = 'step-section';
    sec.id = 'step-' + idx;
    let cardsHTML = '';
    cat.cards.forEach(c => {
      cardsHTML += `<div class="card" data-cat="${key}" data-id="${c.id}" data-label="${c.label}" onclick="toggleCard('${key}','${c.id}',this)"><div class="card-label">${c.label}</div><div class="card-desc">${c.desc}</div></div>`;
    });
    sec.innerHTML = `<div class="step-header"><div class="step-tag">Шаг ${cat.step}</div><h2 class="step-title">${cat.title}</h2><div class="step-desc">${cat.desc}</div></div><div class="cards-grid">${cardsHTML}</div>`;
    container.appendChild(sec);
  });
  showStep(0);
}

function renderNegative() {
  const grid = $('negativePills');
  grid.innerHTML = '';
  DATA.negativeTags.forEach(nt => {
    const b = document.createElement('button');
    b.className = 'negative-pill';
    b.textContent = nt.label;
    b.addEventListener('click', () => toggleNeg(nt.id, b));
    grid.appendChild(b);
  });
}

function showStep(idx) {
  document.querySelectorAll('.step-section').forEach((s, i) => {
    s.classList.toggle('active', i === idx);
  });
  updateProgress();
  updateNav();
}

function updateNav() {
  $('prevBtn').style.display = state.currentStep > 0 ? '' : 'none';
  $('nextBtn').textContent = state.currentStep >= state.totalSteps - 1 ? 'Готово' : 'Далее →';
}

function toggleCard(catKey, cardId, el) {
  const cat = DATA.categories[catKey];
  const arr = state.selections[catKey];
  const i = arr.indexOf(cardId);
  if (i > -1) {
    arr.splice(i, 1);
    el.classList.remove('selected');
  } else {
    if (!cat.multi && cat.multi !== undefined) {
      state.selections[catKey] = [cardId];
      el.parentElement.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    }
    arr.push(cardId);
    el.classList.add('selected');
  }
  generate();
}

function toggleNeg(tagId, el) {
  const i = state.negativeTags.indexOf(tagId);
  if (i > -1) { state.negativeTags.splice(i, 1); el.classList.remove('selected'); }
  else { state.negativeTags.push(tagId); el.classList.add('selected'); }
  generate();
}

function applyPreset(key) {
  const p = DATA.presets[key];
  if (!p) return;
  catOrder.forEach(k => state.selections[k] = []);
  state.negativeTags = [];
  for (const [ck, ids] of Object.entries(p.s)) state.selections[ck] = [...ids];
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.negative-pill').forEach(c => c.classList.remove('selected'));
  catOrder.forEach(ck => {
    state.selections[ck].forEach(id => {
      const el = document.querySelector(`.card[data-cat="${ck}"][data-id="${id}"]`);
      if (el) el.classList.add('selected');
    });
  });
  state.currentStep = 0;
  showStep(0);
  generate();
  toast(`Пресет "${p.name}" применён`);
}

function goToStep(i) {
  if (i < 0 || i >= state.totalSteps) return;
  state.currentStep = i;
  showStep(i);
}

function goNext() {
  if (state.currentStep < state.totalSteps - 1) {
    state.currentStep++;
    showStep(state.currentStep);
  } else {
    generate();
  }
}

function goPrev() {
  if (state.currentStep > 0) {
    state.currentStep--;
    showStep(state.currentStep);
  }
}

function resetAll() {
  catOrder.forEach(k => state.selections[k] = []);
  state.negativeTags = [];
  state.currentStep = 0;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.negative-pill').forEach(c => c.classList.remove('selected'));
  showStep(0);
  $('outputSection').classList.remove('visible');
  generate();
  toast('Сброшено');
}

function getCard(catKey, cardId) {
  return DATA.categories[catKey].cards.find(c => c.id === cardId);
}

function joinNatural(items) {
  if (items.length <= 1) return items[0] || '';
  if (items.length === 2) return `${items[0]} and ${items[1]}`;
  return `${items.slice(0, -1).join(', ')}, and ${items[items.length - 1]}`;
}

function applyGenreRuleBoosts(weights, selectedSet) {
  COMPOSER.genreRuleBoosts.forEach(rule => {
    const ok = rule.when.every(id => selectedSet.has(id));
    if (!ok) return;
    Object.entries(rule.boost).forEach(([genre, points]) => {
      weights[genre] = (weights[genre] || 0) + points;
    });
  });
}

function computeBpmSuggestion(groupedCards, allBPMs) {
  for (const catKey of COMPOSER.bpmPriority) {
    const cards = groupedCards[catKey] || [];
    if (catKey === 'rhythm' && cards.length > 0) {
      const mapped = cards.map(c => COMPOSER.rhythmBuckets[c.id]).filter(Boolean);
      if (mapped.length > 0) {
        const avgMin = Math.round(mapped.reduce((s, v) => s + v[0], 0) / mapped.length);
        const avgMax = Math.round(mapped.reduce((s, v) => s + v[1], 0) / mapped.length);
        return `${avgMin}-${avgMax}`;
      }
    }
    const withBpm = cards.filter(c => c.bpm);
    if (withBpm.length > 0) {
      const avgMin = Math.round(withBpm.reduce((s, c) => s + c.bpm[0], 0) / withBpm.length);
      const avgMax = Math.round(withBpm.reduce((s, c) => s + c.bpm[1], 0) / withBpm.length);
      return `${avgMin}-${avgMax}`;
    }
  }
  if (allBPMs.length === 0) return '—';
  const avgMin = Math.round(allBPMs.reduce((s, v) => s + v[0], 0) / allBPMs.length);
  const avgMax = Math.round(allBPMs.reduce((s, v) => s + v[1], 0) / allBPMs.length);
  return `${avgMin}-${avgMax}`;
}

function generate() {
  const genreWeights = {};
  const allBPMs = [];
  const allTags = [];
  const selectedIds = new Set();
  const groupedCards = { purpose: [], emotion: [], rhythm: [], palette: [], vocals: [], era: [], structure: [] };
  let structureText = '';

  catOrder.forEach(ck => {
    state.selections[ck].forEach(id => {
      const c = getCard(ck, id);
      if (!c) return;
      selectedIds.add(id);
      groupedCards[ck].push(c);
      c.tags.forEach(t => allTags.push(t));
      if (c.genres) {
        for (const [g, w] of Object.entries(c.genres)) {
          genreWeights[g] = (genreWeights[g] || 0) + w;
        }
      }
      if (c.bpm) allBPMs.push(c.bpm);
      if (c.structure) structureText = c.structure;
    });
  });

  applyGenreRuleBoosts(genreWeights, selectedIds);

  const purposeTags = groupedCards.purpose.map(c => c.tags[0]).filter(Boolean);
  const emotionTags = groupedCards.emotion.map(c => c.tags[0]).filter(Boolean);
  const rhythmTags = groupedCards.rhythm.map(c => c.tags[0]).filter(Boolean);
  const paletteTags = groupedCards.palette.map(c => c.tags[0]).filter(Boolean);
  const vocalTags = groupedCards.vocals.map(c => c.tags[0]).filter(Boolean);
  const eraTags = groupedCards.era.map(c => c.tags[0]).filter(Boolean);

  const intro = purposeTags.length ? `${joinNatural(purposeTags)} track` : 'Cinematic music concept';
  const mood = emotionTags.length ? `with ${joinNatural(emotionTags)} emotional tone` : '';
  const movement = rhythmTags.length ? `driven by ${joinNatural(rhythmTags)}` : '';
  const sound = paletteTags.length ? `built around ${joinNatural(paletteTags)}` : '';
  const voice = state.negativeTags.includes('no_vocals') ? 'instrumental arrangement only' : (vocalTags.length ? `featuring ${joinNatural(vocalTags)}` : '');
  const era = eraTags.length ? `framed in ${joinNatural(eraTags)} aesthetics` : '';
  const struct = structureText ? `following ${structureText}` : '';

  const conflictNotes = COMPOSER.conflictRules
    .filter(rule => state.negativeTags.includes(rule.negative))
    .filter(rule => (!rule.selectedCats || rule.selectedCats.some(cat => state.selections[cat]?.length)) &&
      (!rule.selectedIds || rule.selectedIds.some(id => selectedIds.has(id))))
    .map(rule => rule.message);

  const phrases = [intro, mood, sound, voice, movement, era, struct].filter(Boolean);
  let prompt = phrases.join(', ') + '.';
  const productionNotes = conflictNotes.length ? joinNatural([...new Set(conflictNotes)]) : 'balanced mix, clear dynamics, and spacious stereo depth';
  if (conflictNotes.length) prompt += ` Production notes: ${productionNotes}.`;
  const detailTags = [...new Set(allTags)].slice(0, 10);
  const styleTagsText = detailTags.length ? detailTags.join(', ') : '—';
  if (detailTags.length) prompt += ` Style tags: ${styleTagsText}.`;

  state.prompt = prompt;

  // Negative
  state.negativePrompt = state.negativeTags.map(id => {
    const nt = DATA.negativeTags.find(n => n.id === id);
    return nt ? nt.tag : '';
  }).filter(Boolean).join(', ');

  // Genres
  const genres = Object.entries(genreWeights).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([g]) => g);

  // BPM (priority: rhythm -> purpose -> emotion)
  const bpmStr = computeBpmSuggestion(groupedCards, allBPMs);

  // Structure
  const structStr = structureText || '—';

  // Render output
  const out = $('outputSection');
  out.classList.add('visible');
  $('outputText').textContent = prompt;
  $('styleTagsText').textContent = styleTagsText;
  $('prodNotesText').textContent = productionNotes;
  $('bpmMeta').textContent = bpmStr;
  $('structMeta').textContent = structStr;

  const pillsEl = $('genrePills');
  pillsEl.innerHTML = '';
  genres.forEach(g => {
    const p = document.createElement('span');
    p.className = 'genre-pill';
    p.textContent = g;
    pillsEl.appendChild(p);
  });
  if (genres.length === 0) {
    pillsEl.innerHTML = '<span style="color:var(--text-muted);font-size:0.7rem;">—</span>';
  }

  if (state.negativePrompt) {
    $('negOutput').style.display = '';
    $('negText').textContent = state.negativePrompt;
  } else {
    $('negOutput').style.display = 'none';
  }
}

function copyText(text, label) {
  if (!text) { toast('Нечего копировать'); return; }
  navigator.clipboard.writeText(text).then(() => toast(label + ' скопирован')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast(label + ' скопирован');
  });
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function bindEvents() {
  $('nextBtn').addEventListener('click', goNext);
  $('prevBtn').addEventListener('click', goPrev);
  $('resetBtn').addEventListener('click', resetAll);
  $('copyPromptBtn').addEventListener('click', () => {
    copyText(state.prompt, 'Промпт');
    $('copyPromptBtn').classList.add('done');
    $('copyPromptBtn').textContent = 'Скопировано';
    setTimeout(() => { $('copyPromptBtn').classList.remove('done'); $('copyPromptBtn').textContent = 'Копировать промпт'; }, 2000);
  });
  $('copyNegBtn').addEventListener('click', () => {
    copyText(state.negativePrompt, 'Negative');
    $('copyNegBtn').classList.add('done');
    $('copyNegBtn').textContent = 'Скопировано';
    setTimeout(() => { $('copyNegBtn').classList.remove('done'); $('copyNegBtn').textContent = 'Копировать negative'; }, 2000);
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
